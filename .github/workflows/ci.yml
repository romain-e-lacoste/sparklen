name: CI

on:
  pull_request:
  push:
    branches: [main, "dev/**"]
  schedule:
    - cron: "0 6 * * 1"   # every Monday at 06:00 UTC, to catch breakage from new dependency releases
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]   # oldest and newest supported

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0           # setuptools-scm needs the tags to compute the version

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install Sparklen and test dependencies
        run: python -m pip install ".[test]"

      - name: Run tests
        run: pytest

  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        if: needs.lint.result != 'success' || needs.test.result != 'success'
        run: exit 1
