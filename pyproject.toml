[build-system]
requires = [
  "setuptools>=77",
  "setuptools-scm>=8",
  "numpy>=2.0",
  "swig>=4.1",
]
build-backend = "setuptools.build_meta"

[project]
name = "sparklen"
dynamic = ["version"]
description = "A statistical learning toolkit for high-dimensional Hawkes processes in Python"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [
  {name = "Romain E. Lacoste", email = "romain.lacoste@inria.fr"}
]
maintainers = [
  {name = "Romain E. Lacoste", email = "romain.lacoste@inria.fr"}
]
dependencies = [
  "matplotlib",
  "numpy>=1.26",
  "scipy",
  "seaborn",
  "scikit-learn",
  "tabulate",
  "tqdm",
]
keywords = [
  "python", "machine-learning", "statistics", "optimization", "regularization",
  "maximum-likelihood-estimation", "high-dimension", "hawkes-process",
  "empirical-risk-minimization",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Software Development :: Libraries",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "pre-commit", "ruff"]

[project.urls]
Homepage = "https://github.com/romain-e-lacoste/sparklen"
Repository = "https://github.com/romain-e-lacoste/sparklen"
Issues = "https://github.com/romain-e-lacoste/sparklen/issues"
Changelog = "https://github.com/romain-e-lacoste/sparklen/blob/main/CHANGELOG.md"
Paper = "https://arxiv.org/abs/2502.18979"

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "cp3??t-* *-musllinux_* *-win32 *-manylinux_i686"
test-requires = ["pytest>=8"]
test-sources = ["tests"]
test-command = "pytest tests"

[tool.ruff]
line-length = 88
target-version = "py310"
fix = true

[tool.ruff.lint]
select = ["E", "F", "I"]
extend-ignore = ["E501", "F401"]
exclude = ["tests/*", "docs/*"]
